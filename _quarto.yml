project:
  type: website
  output-dir: _site
  resources:
    - projects/tahiti-lemon/interactive/*.html

website:
  title: "Ricardo Ruiz-Cardozo"
  description: "Statistician and plant breeding data scientist: mixed models, Bayesian statistics, information theory and machine learning for agriculture."
  site-url: https://raruizc.github.io
  repo-url: https://github.com/raruizc/raruizc.github.io
  open-graph: true
  page-navigation: false
  back-to-top-navigation: true
  navbar:
    collapse-below: xl
    left:
      - href: index.qmd
        text: Home
        icon: house
      - href: about.qmd
        text: About
        icon: person
      - href: projects/index.qmd
        text: Projects
        icon: grid-3x3-gap
      - href: research.qmd
        text: Research
        icon: journal-text
      - href: open-science.qmd
        text: Open Science
        icon: unlock
      - href: teaching.qmd
        text: Teaching
        icon: easel
    right:
      - icon: github
        href: https://github.com/raruizc
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/ricardo-ruiz-cardozo/
        aria-label: LinkedIn
      - text: "ORCID"
        href: https://orcid.org/0009-0003-9162-8396
        aria-label: ORCID
  page-footer:
    left: "© 2026 Ricardo Antonio Ruiz-Cardozo"
    right: "Built with [Quarto](https://quarto.org) · Hosted on GitHub Pages"

format:
  html:
    theme:
      light: [flatly, styles.scss]
      dark: [darkly, styles-dark.scss]
    toc: false
    smooth-scroll: true
    grid:
      body-width: 960px
      margin-width: 260px
    include-after-body: _includes/motion.html
    code-copy: true
    code-annotations: hover
    highlight-style: github
    link-external-newwindow: true
    lang: en
